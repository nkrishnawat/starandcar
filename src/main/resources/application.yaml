spring:
  application:
    name: starandcar
  web:
    resources:
      static-locations: file:/home/nkrishnawat/uploads/,classpath:/static/,classpath:/public/
    mvc:
      static-path-pattern: /uploads/**
  datasource:
    url: jdbc:mariadb://localhost:3206/starandcardb?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  tomcat:
    max-swallow-size: 100MB
  sql:
    init:
      mode: never
starandcar:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

logging:
  level:
    org.springframework.jdbc.core: TRACE
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
file:
  upload-dir: /home/nkrishnawat/uploads