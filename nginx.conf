# Nginx Configuration for STAR&Car
# Place this in /etc/nginx/sites-available/starandcar and symlink to /etc/nginx/sites-enabled/

upstream springboot_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost; # Replace with your domain name (e.g., starandcar.com)

    # Increase maximum upload size for property photos (matches Spring Boot 50MB limit)
    client_max_body_size 50M;

    # Root directory for static web files
    root /var/www/starandcar;
    index index.html;

    # SEO Crawlers
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # ── Frontend Static Files ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (images & uploads)
    location /images/ {
        alias /var/www/starandcar/images/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /uploads/ {
        alias /home/nkrishnawat/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Backend Spring Boot Proxy ──

    # Property API
    location /property/ {
        proxy_pass http://springboot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Feedback API
    location /feedback/ {
        proxy_pass http://springboot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbox Standard Endpoints (send & received confirmation)
    location /mail/ {
        proxy_pass http://springboot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inbox Real-Time SSE Stream (CRITICAL: buffering MUST be disabled for SSE)
    location /mail/stream {
        proxy_pass http://springboot_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering and caching so events push to the browser instantly
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep long-lived SSE connections open
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
